worker_processes 1;
pid /tmp/textguard-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/textguard-client-body;
    proxy_temp_path /tmp/textguard-proxy;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_header_timeout 1s;
    client_body_timeout 1s;
    send_timeout 1s;
    server {
        listen 8443 ssl;
        client_max_body_size 256k;
        location /v1/ {
            proxy_connect_timeout 20ms;
            proxy_read_timeout 150ms;
            proxy_send_timeout 1s;
            proxy_pass http://127.0.0.1:8081;
        }
        location / { return 404; }
    }
    server {
        listen 8444 ssl;
        http2 on;
        client_max_body_size 257k;
        location /imboy.textguard.v1.TextGuard/ {
            grpc_connect_timeout 20ms;
            grpc_read_timeout 150ms;
            grpc_send_timeout 1s;
            grpc_pass grpc://127.0.0.1:8082;
        }
        location / { return 404; }
    }
}
