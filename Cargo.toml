[package]
name = "imboy-textguard"
version = "0.1.0"
edition = "2021"
rust-version = "1.90.0"
publish = false
build = "build.rs"

[features]
# Test-only fault injection seam for T22 publication fault testing.
# Production builds never enable this; hook call sites compile away.
fault-injection = []

[dependencies]
aho-corasick = "=1.1.5"
axum = "=0.7.9"
http-body = "=1.1.0"
hyper-util = { version = "=0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
libc = "=0.2.190"
prost = "=0.13.5"
regex = "=1.11.2"
regex-syntax = "=0.8.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tonic = "=0.12.3"
tonic-health = "=0.12.3"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

[build-dependencies]
tonic-build = "=0.12.3"

[[bench]]
name = "textguard_perf"
harness = false
