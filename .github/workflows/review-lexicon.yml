name: Review lexicon
on:
  push:
    paths: ['data/dictionaries/review_sources_20261020/**', 'tools/lexicon/**', 'schemas/ruleset.schema.json', '.github/workflows/review-lexicon.yml']
  pull_request:
    paths: ['data/dictionaries/review_sources_20261020/**', 'tools/lexicon/**', 'schemas/ruleset.schema.json', '.github/workflows/review-lexicon.yml']
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: python3 -m pip install jsonschema==4.23.0
      - run: python3 -m unittest discover -s tools/lexicon -p 'test_*.py' -v
      - run: python3 tools/lexicon/validate_review_lexicon.py
