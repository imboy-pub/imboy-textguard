name: Lexicon preparation
on:
  push:
    branches: [feat/review-lexicon-three-rounds]
    paths: ['.github/workflows/lexicon-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'imboy-pub/imboy-textguard' && github.ref == 'refs/heads/feat/review-lexicon-three-rounds'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Apply audited final source-noise exclusions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/lexicon/build_review_lexicon.py')
          text = p.read_text()
          needle = '    if word in BARE:\n'
          insert = (
              "    if any(ord(c) in (42, 124, 94, 36, 60, 62, 34, 123, 125, 91, 93, 92) for c in word):\n"
              "        return 'source_pattern_not_literal'\n"
              "    if re.search(r'^(?:毛|操)(?=色情|淫秽|迷药|冰毒|海洛因|大麻|毒品)', word):\n"
              "        return 'malformed_source_prefix'\n"
              "    if word == '色情词':\n"
              "        return 'benign_meta_topic'\n"
          )
          if 'source_pattern_not_literal' not in text:
              assert text.count(needle) == 1
              p.write_text(text.replace(needle, insert + needle))
          PY
          python3 -m py_compile tools/lexicon/build_review_lexicon.py
      - name: Collect three rounds and validate
        run: |
          set -o pipefail
          mkdir -p lexicon-validation-evidence
          python3 -m pip install jsonschema==4.23.0
          python3 tools/lexicon/build_review_lexicon.py --fetch --cache "$RUNNER_TEMP/lexicon-cache" | tee lexicon-validation-evidence/collection.json
          python3 -m unittest discover -s tools/lexicon -p 'test_*.py' -v 2>&1 | tee lexicon-validation-evidence/python-tests.log
          python3 tools/lexicon/validate_review_lexicon.py | tee lexicon-validation-evidence/static-validation.json
          python3 tools/lexicon/build_review_lexicon.py --cache "$RUNNER_TEMP/lexicon-cache" --out "$RUNNER_TEMP/reproduced"
          for path in COUNTS.json words rulesets provenance licenses; do diff -qr "data/dictionaries/review_sources_20261020/$path" "$RUNNER_TEMP/reproduced/$path"; done
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Reproduce PR 1 alternate-table regression without weakening its assertion
        run: |
          if cargo test --locked --test bootstrap_table > lexicon-validation-evidence/bootstrap-before.log 2>&1; then
            echo 'Expected regression was not reproduced'; exit 1
          fi
          grep 'startup exited for supported table test-t2s-v1' lexicon-validation-evidence/bootstrap-before.log
      - name: Preserve default bootstrap and fail closed for alternate tables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime/server.rs')
          text = p.read_text()
          old = 'if matches!(rules.status(), crate::rules::StoreStatus::Empty) {'
          new = 'if matches!(rules.status(), crate::rules::StoreStatus::Empty) && config.table_id == crate::T2S_TABLE_ID {'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
      - name: Format and validate real Rust snapshot and publication
        run: |
          set -o pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee lexicon-validation-evidence/clippy.log
          cargo test --locked --test bootstrap_table 2>&1 | tee lexicon-validation-evidence/bootstrap-after.log
          cargo test --locked --test review_lexicon 2>&1 | tee lexicon-validation-evidence/lexicon-rust-tests.log
          cargo test --locked 2>&1 | tee lexicon-validation-evidence/full-cargo-tests.log
          cargo build --locked --release 2>&1 | tee lexicon-validation-evidence/release-build.log
      - name: Commit verified data only to the authorized PR branch
        run: |
          test "$GITHUB_REF_NAME" = feat/review-lexicon-three-rounds
          test "$(git ls-remote origin refs/heads/feat/review-lexicon-three-rounds | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          name = 'src/runtime/server.rs'
          before = subprocess.check_output(['git', 'show', 'HEAD:' + name]).decode()
          before = before.replace('if matches!(rules.status(), crate::rules::StoreStatus::Empty) {', 'if matches!(rules.status(), crate::rules::StoreStatus::Empty) && config.table_id == crate::T2S_TABLE_ID {')
          after = Path(name).read_text()
          assert re.sub(r'\s+', '', before) == re.sub(r'\s+', '', after), 'Unexpected runtime change'
          PY
          git add -- data/dictionaries/review_sources_20261020 tools/lexicon/build_review_lexicon.py tests/review_lexicon.rs tests/bootstrap_table.rs src/runtime/server.rs tests/bundled_seed.rs
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: add 8851 source-observed review terms and repair alternate-table bootstrap'
            git push origin HEAD:refs/heads/feat/review-lexicon-three-rounds
          fi
      - name: Archive filtered distribution and validation tooling
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: textguard-lexicon-three-rounds-verified
          path: |
            data/dictionaries/review_sources_20261020/
            tools/lexicon/
            !tools/lexicon/__pycache__/**
            tests/review_lexicon.rs
            tests/bootstrap_table.rs
            schemas/ruleset.schema.json
            lexicon-validation-evidence/
          if-no-files-found: error
          retention-days: 7
